/* VÜCUT KAŞİFİ 2.0 — PREMIUM MOBILE UI */
:root{
  --vk-primary:#19D9B5;
  --vk-primary-dark:#087F73;
  --vk-navy:#102A43;
  --vk-ink:#16202A;
  --vk-muted:#6B7280;
  --vk-bg:#F7FBFA;
  --vk-card:#FFFFFF;
  --vk-border:rgba(16,42,67,.09);
  --vk-shadow:0 12px 30px rgba(16,42,67,.08);
}

html{
  scroll-behavior:smooth;
}

body{
  background:
    radial-gradient(circle at 100% 0%,rgba(25,217,181,.10),transparent 30%),
    radial-gradient(circle at 0% 35%,rgba(99,102,241,.07),transparent 28%),
    var(--vk-bg);
  color:var(--vk-ink);
}

.top{
  min-height:64px;
  padding:10px 18px;

  gap:12px;
}

  align-items:center;
  min-width:0;
}

.brand-logo{
  width:auto;
  height:52px;
  max-width:205px;
  display:block;
  object-fit:contain;
}

.stars{

  align-items:center;

/* ================================

html{

}

body{

.app{
  max-width:520px;

/* HEADER */

.top{
  min-height:70px;
  padding:4px 2px 8px;

  align-items:center;

  gap:12px;
}

.brand{
  display:flex;
  align-items:center;
  min-width:0;
}

.brand-logo{
  height:56px;
  width:auto;
  max-width:210px;
  display:block;
  object-fit:contain;
}

.stars{
  flex:none;
  display:flex;
  align-items:center;
  gap:6px;
  padding:10px 15px;
  border:1px solid rgba(16,42,67,.07);
  border-radius:999px;
  background:rgba(255,255,255,.92);
  box-shadow:0 8px 24px rgba(16,42,67,.08);
  font-weight:900;
  color:var(--vk-navy);
  backdrop-filter:blur(12px);
}

/* HERO */

.hero{
  position:relative;
  overflow:hidden;
  margin-top:12px;
  min-height:300px;
  border-radius:32px;
  padding:26px 22px;
  background:
    radial-gradient(circle at 88% 16%,rgba(255,255,255,.30),transparent 23%),
    radial-gradient(circle at 80% 90%,rgba(85,116,232,.42),transparent 34%),
    linear-gradient(135deg,#087F73 0%,#19BFA8 45%,#5574E8 100%);
  box-shadow:0 20px 45px rgba(16,42,67,.17);
}

.hero:before{
  content:"🧬";
  position:absolute;
  right:20px;
  bottom:22px;
  font-size:86px;
  line-height:1;
  opacity:.16;
  transform:rotate(-8deg);
  pointer-events:none;
}

.hero:after{
  content:"";
  position:absolute;
  width:190px;
  height:190px;
  right:-80px;
  bottom:-105px;
  border-radius:50%;
  background:rgba(255,255,255,.11);
  pointer-events:none;
}

.hero h1{
  position:relative;
  z-index:2;
  margin:0 0 10px;
  font-size:32px;
  line-height:1.08;
  letter-spacing:-1px;
  max-width:330px;
}

.hero p{
  position:relative;
  z-index:2;
  max-width:355px;
  margin:0 0 22px;
  font-size:17px;
  line-height:1.48;
  opacity:.94;
}

.hero button{
  position:relative;
  z-index:3;
  border:0;
  border-radius:17px;
  padding:15px 21px;
  min-height:52px;
  font-size:16px;
  font-weight:900;
  box-shadow:0 10px 24px rgba(0,0,0,.15);
  transition:transform .16s ease,box-shadow .16s ease;
}

.hero button:active{
  transform:scale(.97);
  box-shadow:0 6px 15px rgba(0,0,0,.12);
}

/* SECTION */

.section{
  margin-top:27px;
}

.section h2{
  margin:0 0 14px 2px;
  font-size:25px;
  line-height:1.1;
  letter-spacing:-.7px;
}

/* ORGAN CARDS */

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

.card{
  position:relative;
  overflow:hidden;
  min-height:185px;
  padding:17px;
  border:1px solid var(--vk-border);
  border-radius:24px;
  background:rgba(255,255,255,.94);
  box-shadow:var(--vk-shadow);
  transition:transform .16s ease,box-shadow .16s ease;
}

.card:before{
  content:"";
  position:absolute;
  width:75px;
  height:75px;
  right:-28px;
  top:-28px;
  border-radius:50%;
  background:rgba(25,217,181,.08);
}

.card:after{
  content:"Keşfet →";
  position:absolute;
  right:14px;
  bottom:13px;
  font-size:11px;
  font-weight:800;
  color:var(--vk-primary-dark);
  opacity:.75;
}

.card:active{
  transform:scale(.975);
  box-shadow:0 8px 20px rgba(16,42,67,.08);
}

.card .icon{
  position:relative;
  z-index:1;
  font-size:43px;
  line-height:1;
  margin-bottom:10px;
}

.card h3{
  position:relative;
  z-index:1;
  margin:0 0 5px;
  font-size:21px;
  letter-spacing:-.4px;
}

.card .muted{
  position:relative;
  z-index:1;
  color:var(--vk-muted);
  font-size:14px;
  line-height:1.35;
  max-width:130px;
}

/* PROGRESS DECORATION */

.card[data-topic]{
  padding-bottom:43px;
}

.card[data-topic]:not([data-topic="bones"]) .muted:after{
  content:"";
  display:block;
  width:62px;
  height:5px;
  margin-top:10px;
  border-radius:99px;
  background:linear-gradient(90deg,var(--vk-primary) 65%,#E8EFF0 65%);
}

.card[data-topic="bones"] .muted:after{
  content:"";
  display:block;
  width:62px;
  height:5px;
  margin-top:10px;
  border-radius:99px;
  background:linear-gradient(90deg,var(--vk-primary) 45%,#E8EFF0 45%);
}

/* QUIZ */

.back{
  border:1px solid var(--vk-border);
  background:#fff;
  border-radius:14px;
  box-shadow:0 5px 16px rgba(16,42,67,.05);
}

.progress{
  height:9px;
  margin-top:12px;
  background:#E5ECEB;
  border-radius:99px;
  overflow:hidden;
}

.bar{
  height:100%;
  background:linear-gradient(90deg,var(--vk-primary),var(--vk-blue));
  transition:width .3s ease;
}

.bodymap{
  padding:20px 10px 8px;
  text-align:center;
  font-size:105px;
}

.question{
  font-size:23px;
  line-height:1.22;
  letter-spacing:-.4px;
}

.answer{
  border:2px solid #E8ECEE;
  border-radius:16px;
  background:#fff;
  min-height:54px;
  transition:transform .14s ease,border-color .14s ease;
}

.answer:active{
  transform:scale(.985);
}

.answer.correct{
  background:#E9FAF4;
  border-color:#4FC39A;
}

.answer.wrong{
  background:#FFF0F4;
  border-color:#FF8BA7;
}

/* LEARN */

.learn{
  border:1px solid var(--vk-border);
  border-radius:25px;
  padding:22px;
  background:#fff;
  box-shadow:var(--vk-shadow);
  line-height:1.6;
}

/* BOTTOM APP NAVIGATION */

.vk-nav{
  position:fixed;
  z-index:1000;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:min(520px,100%);

    calc(8px + env(safe-area-inset-bottom))

}

.vk-nav-inner{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;

.vk-nav button{
  border:0;

  font-size:11px;
  font-weight:800;

  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;

.vk-nav button .nav-icon{
  font-size:22px;
  line-height:1;

.vk-nav button.active{
  color:var(--vk-primary-dark);

}
@keyframes wrongShake{
  25%{transform:translateX(-7px)}
  50%{transform:translateX(7px)}

/* ==========================================
   VÜCUT KAŞİFİ 3.2 ENGINE

const qs=[

   ["🦴","Kemiklere"],
   ["👀","Gözlere"],
   ["🫁","Akciğerlere"],
   ["❤️","Kalbe"]

  correct:2,

 },
 {
  icon:"🦴",

  options:[
   ["🦴","Vücudumuza destek olur"],
   ["❤️","Kanı pompalar"],

 {
  icon:"💪",

  options:[
   ["👃","Koklamaya"],
   ["💪","Hareket etmeye"],
   ["👂","Duymaya"],
   ["👀","Görmeye"]
  ],
  correct:1,
  info:"Kaslarımız hareket etmemize yardım eder."
 },
 {
  icon:"👀",
  speak:"Gözlerimiz ne işe yarar?",
  options:[
   ["❤️","Kanı pompalamak"],
   ["🦴","Destek olmak"],
   ["👀","Görmek"],
   ["🫁","Nefes almak"]
  ],
  correct:2,
  info:"Gözlerimiz çevremizdeki dünyayı görmemizi sağlar."
 }
];

let i=0;
let score=0;
let answered=false;

const $=id=>document.getElementById(id);

function show(id){
 document.querySelectorAll(".screen")
   .forEach(x=>x.classList.remove("active"));

 $(id).classList.add("active");

 window.scrollTo({
   top:0,
   behavior:"smooth"
 });

/* SES */

function speak(text){
  /*
   * VÜCUT KAŞİFİ SES MOTORU
   * 1. Önce kaliteli yerel MP3
   * 2. MP3 yoksa geçici Android TTS
   */

  const audioMap = {
    "Merhaba minik bilim insanı! İnsan vücudunu birlikte keşfetmeye hazır mısın?":
      "welcome.mp3",

    "Beynimiz ne işe yarar?":
      "brain-question.mp3",

    "Kalbimiz ne yapar?":
      "heart-question.mp3",

    "Nefes aldığımızda hava nereye gider?":
      "lungs-question.mp3",

    "Kemiklerimiz ne işe yarar?":
      "bones-question.mp3",

    "Kaslarımız neye yardım eder?":
      "muscle-question.mp3",

    "Gözlerimiz ne işe yarar?":
      "eyes-question.mp3",

    "Harika! Doğru cevap. Beynimiz düşünmemize, öğrenmemize ve vücudumuzu yönetmemize yardım eder.":
      "correct.mp3",

    "Bir daha deneyelim. Beynimiz düşünmemize, öğrenmemize ve vücudumuzu yönetmemize yardım eder.":
      "try-again.mp3"
  };

  const file=audioMap[text];

  if(file){
    const audio=new Audio("assets/audio/"+file);

    audio.preload="auto";

    audio.play().catch(()=>{
      fallbackSpeak(text);
    });

    return;
  }

  fallbackSpeak(text);
}

function fallbackSpeak(text){

  if(!("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();

  const u=new SpeechSynthesisUtterance(text);

  u.lang="tr-TR";
  u.rate=.82;
  u.pitch=1.04;
  u.volume=1;

  const voices=window.speechSynthesis.getVoices();

  const tr=voices.find(v =>
    v.lang &&
    v.lang.toLowerCase().startsWith("tr")
  );

  if(tr) u.voice=tr;

  window.speechSynthesis.speak(u);
}

/* ANA SAYFA */

$("welcomeVoice").onclick=()=>{
 speak(
  "Merhaba minik bilim insanı! " +
  "İnsan vücudunu birlikte keşfetmeye hazır mısın?"
 );
};

$("play").onclick=()=>{
 i=0;
 score=0;
 answered=false;

 $("stars").textContent="⭐ 0";

 show("quiz");
 render();

 setTimeout(()=>{
   speak(qs[0].speak);
 },250);
};

/* QUIZ */

function render(){

 const q=qs[i];

 answered=false;

 $("emoji").textContent=q.icon;

 $("bar").style.width=
   ((i)/qs.length*100)+"%";

 $("msg").textContent="";

 $("next").style.display="none";

 $("answers").innerHTML="";

 q.options.forEach((option,n)=>{

   const b=document.createElement("button");

   b.className="vk-answer";

   b.setAttribute(
     "aria-label",
     option[1]
   );

   b.innerHTML=
     '<span class="vk-answer-emoji">'+
     option[0]+
     '</span>';

   b.onclick=()=>{
     answer(n,b);
   };

   $("answers").appendChild(b);
 });
}

$("listenQuestion").onclick=()=>{
 speak(qs[i].speak);
};

function answer(n,b){

 if(answered) return;

 answered=true;

 const q=qs[i];

 if(n===q.correct){

   score++;

   b.classList.add("correct");

   $("msg").textContent="🎉 Harika!";

   speak(
     "Harika! Doğru cevap. "+
     q.info
   );

 }else{

   b.classList.add("wrong");

   $("msg").textContent=
     "💚 Bir daha deneyelim.";

   speak(
     "Bir daha deneyelim. "+
     q.info
   );
 }

 [...$("answers").children].forEach(
   (x,j)=>{
     x.disabled=true;

     if(j===q.correct)
       x.classList.add("correct");
   }
 );

 $("stars").textContent="⭐ "+score;

 $("bar").style.width=
   ((i+1)/qs.length*100)+"%";

 $("next").style.display="block";
}

$("next").onclick=()=>{

 if(i<qs.length-1){

   i++;

   render();

   setTimeout(()=>{
     speak(qs[i].speak);
   },200);

 }else{

   $("emoji").textContent="🏆";

   $("answers").innerHTML="";

   $("msg").textContent=
     "⭐ "+score+" harika cevap!";

   $("next").textContent="🔄 Tekrar oyna";

   $("next").style.display="block";

   speak(
     "Tebrikler! Keşfi tamamladın. "+
     score+" doğru cevap verdin."
   );

   $("next").onclick=()=>{
     $("next").textContent="➡️ Devam";
     i=0;
     score=0;
     show("quiz");
     render();
     setTimeout(()=>{
       speak(qs[0].speak);
     },200);
   };
 };
};

/* ORGANLAR */

const organs={

 brain:[
  "🧠",
  "Beyin",
  "Beynimiz düşünmemize, öğrenmemize ve vücudumuzu yönetmemize yardım eder."
 ],

 heart:[
  "❤️",

 ],

 lungs:[
  "🫁",
  "Akciğerler",
  "Akciğerlerimiz nefes almamıza ve oksijeni vücudumuzun kullanmasına yardım eder."
 ],

 bones:[

  "Kemikler",
  "Kemiklerimiz vücudumuza destek ve şekil verir."
 ]
};

document.querySelectorAll("[data-topic]")
.forEach(card=>{

 card.onclick=()=>{

   const d=organs[card.dataset.topic];

   $("learnBox").innerHTML=
     '<div class="vk-learn-visual">'+d[0]+'</div>'+

     '🔊 Dinlemek için aşağıdaki düğmeye dokun.'+
     '</div>'+
     '<button class="vk-big-action" id="speakLearn">'+

   show("learn");

   setTimeout(()=>{

   },250);

   $("speakLearn").onclick=()=>{
     speak(d[2]);

 };
});

/* GERİ */

$("backQuiz").onclick=()=>{
 show("home");
};

/* ALT NAVİGASYON */

document.querySelectorAll(".vk-nav button")
.forEach(btn=>{

 btn.addEventListener("click",()=>{

   document.querySelectorAll(".vk-nav button")
    .forEach(x=>x.classList.remove("active"));

   btn.classList.add("active");

   const target=btn.dataset.nav;

   if(target==="home"){

     speak("Ana sayfa");
   }

   if(target==="support"){

     $("learnBox").innerHTML=

       '<div class="vk-learn-title">Yardım</div>'+

       'Burada güvendesin. Birlikte keşfetmeye devam edebiliriz.'+
       '</div>'+
       '<button class="vk-big-action" id="supportSpeak">'+
       '🔊 Dinle'+
       '</button>';

     speak(
       "Burada güvendesin. "+
       "Birlikte keşfetmeye devam edebiliriz."
     );

     $("supportSpeak").onclick=()=>{
       speak(
         "Burada güvendesin. "+
         "Birlikte keşfetmeye devam edebiliriz."
       );
     };
   }

   if(target==="progress"){

     show("learn");

     const percent=

     $("learnBox").innerHTML=

     $("learnBox").innerHTML=

       '🔊 Dinle'+
       '</button>';

     speak(
       "Sen bir minik bilim insanısın. "+
       "Keşfetmeye devam et!"

     $("profileSpeak").onclick=()=>{
       speak(
         "Sen bir minik bilim insanısın. "+
         "Keşfetmeye devam et!"
       );
     };
   }
 });
});
</script>

<script id="vk33-engine">
(function(){
  const experience=document.getElementById("brainExperience");
  if(!experience) return;

  const close=document.getElementById("brainClose");
  const action=document.getElementById("brainAction");
  const visual=document.getElementById("brainVisual");
  const message=document.getElementById("brainMessage");
  const title=document.getElementById("brainTitle");
  const sub=document.getElementById("brainSub");
  const progress=document.getElementById("brainProgress");
  const options=document.getElementById("brainOptions");

  let step=0;

  function voice(text){
    if(window.speechSynthesis){
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.lang="tr-TR";
      u.rate=.82;
      u.pitch=1.04;
      u.volume=1;
      const voices=speechSynthesis.getVoices();
      const tr=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith("tr"));
      if(tr) u.voice=tr;
      speechSynthesis.speak(u);
    }
  }

  function pulse(){
    visual.classList.remove("pulse");
    void visual.offsetWidth;
    visual.classList.add("pulse");
  }

  function open(){
    step=0;
    experience.classList.add("active");
    experience.setAttribute("aria-hidden","false");
    options.style.display="none";
    action.style.display="block";
    title.textContent="Beyni keşfet!";
    sub.textContent="Dokun ve ne olduğunu gör.";
    message.textContent="Hazırsan başlayalım!";
    progress.style.width="25%";
    voice("Beyni keşfetmeye hazır mısın?");
  }

  function exit(){
    experience.classList.remove("active");
    experience.setAttribute("aria-hidden","true");
    if(window.speechSynthesis) speechSynthesis.cancel();
  }

  function next(){
    step++;
    pulse();

    if(step===1){
      title.textContent="Beyin çalışıyor!";
      sub.textContent="Beyin bizim kontrol merkezimiz.";
      message.textContent="✨ Düşünürüz!";
      progress.style.width="50%";
      voice("Beynimiz düşünmemize yardım eder.");
      action.textContent="👆 BİR KEZ DAHA";
    }
    else if(step===2){
      title.textContent="Şimdi oyun!";
      sub.textContent="Doğru olanı bul.";
      message.textContent="🧠 Beyni bul!";
      progress.style.width="75%";
      action.style.display="none";
      options.style.display="grid";
      voice("Beyni bul.");
    }
  }

  action.addEventListener("click",next);
  close.addEventListener("click",exit);

  options.querySelectorAll(".brain-option").forEach(btn=>{
    btn.addEventListener("click",()=>{
      if(btn.dataset.answer==="🧠"){
        btn.classList.add("correct");
        message.textContent="🎉 HARİKA!";
        progress.style.width="100%";
        pulse();
        voice("Harika! Beyni buldun.");
        setTimeout(()=>{
          title.textContent="Beyin tamam!";
          sub.textContent="Bir sonraki organ seni bekliyor.";
          message.textContent="⭐ Süpersin!";
          options.style.display="none";
          action.style.display="block";
          action.textContent="✓ BİTİR";
        },900);
        action.onclick=()=>{
          exit();
          action.onclick=next;
          action.textContent="👆 DOKUN";
        };
      }else{
        btn.classList.add("wrong");
        message.textContent="🙂 Tekrar deneyelim!";
        voice("Tekrar deneyelim.");
        setTimeout(()=>btn.classList.remove("wrong"),400);
      }
    });
  });

  window.openBrainExperience=open;
})();
</script>
